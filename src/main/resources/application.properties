spring.application.name=wastemanagement

spring.datasource.url=jdbc:mysql://localhost:3306/waste_management
spring.datasource.username=root
spring.datasource.password=admin1234

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# Spring Boot Actuator: expose only safe monitoring endpoints over HTTP
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Application information shown by Actuator /actuator/info
info.app.name=Waste Collection Management System
info.app.description=Waste collection records and zone-wise waste reporting
info.app.version=0.0.1-SNAPSHOT

# Swagger / OpenAPI documentation
springdoc.swagger-ui.path=/swagger-ui.html
